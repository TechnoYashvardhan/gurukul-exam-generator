<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vedic Saffron-Gold Radiant Gradient -->
    <linearGradient id="vedicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glowing Sacred Flame Gradient -->
    <linearGradient id="vedicFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Inner Core Flame -->
    <linearGradient id="innerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Squircle Badge with Golden Inner Rim -->
  <rect width="100" height="100" rx="22" fill="url(#vedicBg)" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#fef3c7" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Surya Mandala Rays (Sun of Knowledge Aura) -->
  <g stroke="#fef3c7" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="50" y1="8" x2="50" y2="14" />
    <line x1="50" y1="86" x2="50" y2="92" />
    <line x1="8" y1="50" x2="14" y2="50" />
    <line x1="86" y1="50" x2="92" y2="50" />
    <line x1="20" y1="20" x2="25" y2="25" />
    <line x1="80" y1="20" x2="75" y2="25" />
    <line x1="20" y1="80" x2="25" y2="75" />
    <line x1="80" y1="80" x2="75" y2="75" />
  </g>

  <!-- Open Granth Pages (Layered Palm Leaf Manuscript) -->
  <path d="M50 78 C34 72 20 74 15 78 C15 56 32 52 50 57 C68 52 85 56 85 78 C80 74 66 72 50 78 Z" fill="#ffffff" />
  <!-- Spine Line & Sacred Bookmark Ribbon -->
  <path d="M50 78 V57" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
  <path d="M50 78 L53 84 L50 82 L47 84 Z" fill="#fef3c7" />

  <!-- Multi-tiered Vedic Flame (ज्ञान दीप) -->
  <!-- Outer Petal Wings -->
  <path d="M50 15 C34 32 30 46 41 55 C46 52 48 47 50 43 C52 47 54 52 59 55 C70 46 66 32 50 15 Z" fill="url(#vedicFlame)" />
  
  <!-- Inner Heart Flame -->
  <path d="M50 25 C42 36 42 46 50 51 C58 46 58 36 50 25 Z" fill="url(#innerFlame)" opacity="0.9" />

  <!-- AI Diamond Sparkle (प्रज्ञा) -->
  <path d="M50 34 Q50 40 56 40 Q50 40 50 46 Q50 40 44 40 Q50 40 50 34 Z" fill="#ffffff" />

  <!-- Sacred Bindi / Tilak Top Dot -->
  <circle cx="50" cy="11" r="2" fill="#fffbeb" />
</svg>
