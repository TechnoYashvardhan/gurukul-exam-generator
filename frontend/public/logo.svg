<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Radiant Gradient -->
    <linearGradient id="gkLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    
    <!-- Gold Flame Gradient -->
    <linearGradient id="gkLogoFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="gkShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Container Badge -->
  <rect width="100" height="100" rx="24" fill="url(#gkLogoBg)" filter="url(#gkShadow)" />

  <!-- Open Granth Pages (Vedic Manuscript Base) -->
  <path d="M50 78 C35 72 20 74 15 78 C15 54 34 50 50 55 C66 50 85 54 85 78 C80 74 65 72 50 78 Z" fill="#ffffff" fill-opacity="0.95" />
  <path d="M50 78 V55" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Outer Flame / Sacred Lotus Petals -->
  <path d="M50 16 C38 32 32 45 42 54 C46 51 48 46 50 42 C52 46 54 51 58 54 C68 45 62 32 50 16 Z" fill="url(#gkLogoFlame)" />

  <!-- Center AI Star / Core Sparkle -->
  <path d="M50 32 Q50 39 57 39 Q50 39 50 46 Q50 39 43 39 Q50 39 50 32 Z" fill="#ffffff" />
  
  <!-- Subtle Vedic Halo Dots -->
  <circle cx="50" cy="12" r="2.5" fill="#fef3c7" />
  <circle cx="38" cy="18" r="1.5" fill="#fef3c7" opacity="0.8" />
  <circle cx="62" cy="18" r="1.5" fill="#fef3c7" opacity="0.8" />
</svg>
